<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Nailong</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Framed game box, centered in the viewport at native resolution (matches v1) */
    #game-wrapper {
      position: relative;
      border: 4px solid #2d2d44;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      max-width: 100vw;
      max-height: 100vh;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    #score-bar {
      background: #2d2d44;
      color: #ffffff;
      text-align: center;
      padding: 10px;
      font: bold 20px monospace;
      letter-spacing: 1px;
    }

    /* Pause button — visible only on touch devices */
    #pause-btn {
      display: none;
      position: absolute;
      top: 10px;
      right: 10px;
      width: 36px;
      height: 36px;
      background: rgba(0, 0, 0, 0.5);
      border: 2px solid rgba(255, 255, 255, 0.6);
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      z-index: 10;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      display: none;
      align-items: center;
      justify-content: center;
    }

    @media (pointer: coarse) {
      #pause-btn {
        display: flex;
      }
    }

    /* Mobile portrait: rotate prompt + scale the wrapper to fit */
    @media (max-aspect-ratio: 4/3) and (max-width: 900px) {
      #game-wrapper {
        transform: rotate(90deg);
        transform-origin: center center;
        max-width: 100vh;
        max-height: 100vw;
      }
    }

  </style>
</head>
<body>
  <div id="game-wrapper">
    <button id="pause-btn" aria-label="Pause">❚❚</button>
    <canvas id="game" width="800" height="600"></canvas>
    <div id="score-bar">Score: 0 | High: 0</div>
  </div>
  <script>
    // ============================================================
    // CONFIG — Centralized tunable parameters (single source of truth)
    // ============================================================
    const CONFIG = {
      canvas: {
        width: 800,
        height: 600,
        hudHeight: 0,
        targetFps: 60,
        maxDt: 0.033,
        backgroundColor: '#87CEEB'
      },
      physics: {
        gravity: 900,
        jumpVelocity: -300,
        terminalVelocityDown: 600,
        terminalVelocityUp: -400
      },
      difficulty: {
        baseSpeed: 120,
        speedIncrement: 15,
        maxSpeed: 280,
        baseGap: 140,
        gapDecrement: 5,
        minGap: 90,
        baseSpacing: 350,
        spacingDecrement: 15,
        minSpacing: 200,
        scoreTierSize: 10
      },
      ghost: {
        width: 44,
        height: 44,
        hitboxRadius: 16,
        startX: 150,
        startY: 300
      },
      character: {
        spriteWidth: 44,
        spriteHeight: 44,
        hitboxRadius: 16,
        startX: 150,
        startY: 300,
        maxDownTilt: 0.6,
        maxUpTilt: 0.4,
        maxDescentVelocity: 600,
        maxAscentVelocity: 400
      },
      wingAnimation: {
        baseRateMin: 250,
        baseRateMax: 350,
        jumpRateMin: 120,
        jumpRateMax: 180,
        rapidRateMin: 60,
        rapidRateMax: 100,
        jumpBoostDuration: 300,
        rapidDetectionWindow: 200
      },
      pipes: {
        width: 60,
        gapMinPercent: 0.2,
        gapMaxPercent: 0.8,
        fillColor: '#2ecc40',
        outlineColor: '#1a7a28',
        outlineWidth: 2,
        capOverhang: 8,
        capHeight: 25,
        capBorderRadius: 4,
        capColor: '#1a7a28'
      },
      flyingObstacles: {
        activationThreshold: 30,
        maxOnScreen: 2,
        baseSpawnIntervalMin: 3000,
        baseSpawnIntervalMax: 5000,
        minSpawnIntervalMin: 1500,
        minSpawnIntervalMax: 2500,
        spawnIntervalDecrement: 400,
        baseSpeedMultiplier: 1.2,
        maxSpeedMultiplier: 2.0,
        speedMultiplierIncrement: 0.2,
        spawnYMinPercent: 0.15,
        spawnYMaxPercent: 0.85,
        heightRatio: 1.0,
        poolSize: 4
      },
      collectibles: {
        width: 30,
        height: 20,
        spawnProbabilityMin: 0.3,
        spawnProbabilityMax: 0.5,
        speedFactorMin: 0.5,
        speedFactorMax: 1.5,
        opacityMin: 0.4,
        opacityMax: 0.7,
        bonusPoints: 5
      },
      clouds: {
        layers: [
          { speedFactor: [0.1, 0.3], opacity: [0.1, 0.3], scale: [0.2, 0.4] },
          { speedFactor: [0.4, 0.6], opacity: [0.3, 0.5], scale: [0.5, 0.7] },
          { speedFactor: [0.7, 0.9], opacity: [0.5, 0.7], scale: [0.8, 1.0] }
        ],
        countPerLayer: [2, 5],
        baseWidth: [60, 120]
      },
      particles: {
        trailRateMin: 3,
        trailRateMax: 8,
        burstCountMin: 5,
        burstCountMax: 10,
        radiusMin: 2,
        radiusMax: 5,
        opacityMin: 0.3,
        opacityMax: 0.6,
        lifespanMin: 200,
        lifespanMax: 500
      },
      shake: {
        intensity: 3,
        durationMin: 200,
        durationMax: 400
      },
      scorePopup: {
        lifespanMin: 500,
        lifespanMax: 1000
      },
      audio: {
        musicVolume: 0.3,
        sfxVolume: 1.0
      },
      pools: {
        pipes: 8,
        collectibles: 6,
        particles: 100,
        scorePopups: 5,
        clouds: 15
      }
    };

    // ============================================================
    // applyUrlOverrides — Parse URL query params to override CONFIG
    // Uses dot-notation keys, preserves types, only overrides existing keys
    // ============================================================
    function applyUrlOverrides(config) {
      const params = new URLSearchParams(window.location.search);
      for (const [key, value] of params) {
        const parts = key.split('.');
        let target = config;
        for (let i = 0; i < parts.length - 1; i++) {
          if (target[parts[i]] !== undefined) {
            target = target[parts[i]];
          } else {
            target = null;
            break;
          }
        }
        if (target !== null && target[parts[parts.length - 1]] !== undefined) {
          const existing = target[parts[parts.length - 1]];
          if (typeof existing === 'number') {
            target[parts[parts.length - 1]] = parseFloat(value);
          } else if (Array.isArray(existing)) {
            try {
              target[parts[parts.length - 1]] = JSON.parse(value);
            } catch (e) {
              // Invalid JSON for array override — skip silently
            }
          } else {
            target[parts[parts.length - 1]] = value;
          }
        }
      }
      return config;
    }

    // Apply URL overrides at startup before any subsystem initialization
    applyUrlOverrides(CONFIG);

    // ============================================================
    // ObjectPool — Reusable object management to avoid GC pressure
    // ============================================================
    class ObjectPool {
      constructor(factory) {
        this._factory = factory;
        this._free = [];
      }

      acquire() {
        return this._free.length > 0 ? this._free.pop() : this._factory();
      }

      release(obj) {
        this._free.push(obj);
      }

      prewarm(count) {
        for (let i = 0; i < count; i++) {
          this._free.push(this._factory());
        }
      }

      get freeCount() {
        return this._free.length;
      }
    }

    // ============================================================
    // Game State — Initial structure referencing CONFIG values
    // ============================================================
    function createInitialGameState() {
      return {
        // State machine
        state: 'ready',

        // Ghost
        ghost: {
          x: CONFIG.ghost.startX,
          y: CONFIG.ghost.startY,
          width: CONFIG.ghost.width,
          height: CONFIG.ghost.height,
          velocity: 0,
          hitboxRadius: CONFIG.ghost.hitboxRadius,
          tiltAngle: 0
        },

        // Pipes (managed via pool)
        pipes: [],

        // Collectibles (managed via pool)
        collectibles: [],

        // Clouds — three parallax layers
        clouds: [[], [], []],

        // Particles (managed via pool)
        particles: [],

        // Flying obstacles (managed via pool)
        flyingObstacles: [],

        // Score popups (managed via pool)
        scorePopups: [],

        // Flying obstacle spawn timer
        flyingObsSpawnTimer: 0,
        flyingObsCurrentInterval: 0,

        // Scoring
        score: 0,
        highScore: 0,
        isNewHighScore: false,

        // Difficulty (recalculated each frame from score)
        difficulty: {
          pipeSpeed: CONFIG.difficulty.baseSpeed,
          gapHeight: CONFIG.difficulty.baseGap,
          pipeSpacing: CONFIG.difficulty.baseSpacing
        },

        // Screen shake
        shake: {
          active: false,
          duration: 0,
          elapsed: 0,
          intensity: CONFIG.shake.intensity
        },

        // Timing
        lastTimestamp: 0,
        deltaTime: 0
      };
    }

    // ============================================================
    // Canvas Setup
    // ============================================================
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    // ============================================================
    // Initialize game state
    // ============================================================
    let gameState = createInitialGameState();

    // ============================================================
    // Subsystem modules (to be implemented in subsequent tasks)
    // ============================================================

    // InputHandler — Captures and normalizes player input from multiple sources
    const InputHandler = {
      _jumpFlag: false,
      _pauseFlag: false,
      _touchHoldInterval: null,
      _touchHeld: false,

      init(canvasEl) {
        // Keyboard input
        document.addEventListener('keydown', (e) => {
          if (e.code === 'Space' || e.key === ' ') {
            e.preventDefault();
            this._jumpFlag = true;
          } else if (e.code === 'Escape' || e.code === 'KeyP' || e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
            e.preventDefault();
            this._pauseFlag = true;
          }
        });

        // Mouse input on canvas (jump)
        canvasEl.addEventListener('mousedown', (e) => {
          e.preventDefault();
          this._jumpFlag = true;
        });

        // Touch input on canvas (jump + hold-for-rapid)
        canvasEl.addEventListener('touchstart', (e) => {
          e.preventDefault();
          this._jumpFlag = true;
          this._touchHeld = true;
          // Small delay (150ms) before rapid-fire kicks in — prevents accidental
          // rapid jumps when the user just doesn't lift their finger fast enough.
          if (this._touchHoldInterval) clearInterval(this._touchHoldInterval);
          this._touchHoldTimeout = setTimeout(() => {
            if (this._touchHeld) {
              this._touchHoldInterval = setInterval(() => {
                if (this._touchHeld) {
                  this._jumpFlag = true;
                }
              }, 80);
            }
          }, 150);
        });

        canvasEl.addEventListener('touchend', (e) => {
          this._touchHeld = false;
          if (this._touchHoldTimeout) {
            clearTimeout(this._touchHoldTimeout);
            this._touchHoldTimeout = null;
          }
          if (this._touchHoldInterval) {
            clearInterval(this._touchHoldInterval);
            this._touchHoldInterval = null;
          }
        });

        canvasEl.addEventListener('touchcancel', (e) => {
          this._touchHeld = false;
          if (this._touchHoldTimeout) {
            clearTimeout(this._touchHoldTimeout);
            this._touchHoldTimeout = null;
          }
          if (this._touchHoldInterval) {
            clearInterval(this._touchHoldInterval);
            this._touchHoldInterval = null;
          }
        });

        // Pause button (for mobile, doesn't trigger jump)
        const pauseBtn = document.getElementById('pause-btn');
        if (pauseBtn) {
          pauseBtn.addEventListener('touchstart', (e) => {
            e.stopPropagation();
            e.preventDefault();
            this._pauseFlag = true;
          });
          pauseBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            e.preventDefault();
            this._pauseFlag = true;
          });
        }
      },

      pollJump() {
        const val = this._jumpFlag;
        this._jumpFlag = false;
        return val;
      },

      pollPause() {
        const val = this._pauseFlag;
        this._pauseFlag = false;
        return val;
      },

      reset() {
        this._jumpFlag = false;
        this._pauseFlag = false;
      }
    };
    // StateManager — Controls game state transitions and validates transition legality
    const StateManager = {
      currentState: 'ready',

      _transitions: {
        ready: ['playing'],
        playing: ['paused', 'game_over'],
        paused: ['playing'],
        game_over: ['ready']
      },

      transition(newState) {
        if (this._transitions[this.currentState].includes(newState)) {
          this.currentState = newState;
          return true;
        }
        return false;
      },

      isPlaying() { return this.currentState === 'playing'; },
      isPaused() { return this.currentState === 'paused'; },
      isReady() { return this.currentState === 'ready'; },
      isGameOver() { return this.currentState === 'game_over'; }
    };

    // _resetGameState — Resets all game state for a new session (GameOver → Ready)
    function _resetGameState() {
      // Reset ghost to starting position
      gameState.ghost.x = CONFIG.ghost.startX;
      gameState.ghost.y = CONFIG.ghost.startY;
      gameState.ghost.velocity = 0;

      // Clear pipes, collectibles, and flying obstacles
      gameState.pipes.length = 0;
      gameState.collectibles.length = 0;
      gameState.flyingObstacles.length = 0;
      gameState.flyingObsSpawnTimer = 0;
      gameState.flyingObsCurrentInterval = 0;

      // Reset particles and popups
      ParticleSystem.reset();
      ScorePopupManager.reset();

      // Reset score
      ScoreManager.reset();

      // Reset shake
      gameState.shake.active = false;
      gameState.shake.elapsed = 0;

      // Reset difficulty to base
      gameState.difficulty = DifficultyManager.evaluate(0);

      // Reset wing animation controller
      wingAnimController.reset();

      // Clouds persist across games (visual continuity)

      // Clear any buffered inputs
      InputHandler.reset();
    }

    // processTransitions — Connects input flags to state machine transitions
    function processTransitions(jumpInput, pauseInput) {
      const state = StateManager.currentState;
      const pauseBtn = document.getElementById('pause-btn');

      if (state === 'ready' && jumpInput) {
        StateManager.transition('playing');
        AudioManager.startMusic();
      }
      else if (state === 'playing' && pauseInput) {
        StateManager.transition('paused');
        AudioManager.pauseMusic();
        if (pauseBtn) pauseBtn.textContent = '▶';
      }
      else if (state === 'paused' && pauseInput) {
        StateManager.transition('playing');
        AudioManager.resumeMusic();
        if (pauseBtn) pauseBtn.textContent = '❚❚';
      }
      else if (state === 'game_over' && jumpInput) {
        StateManager.transition('ready');
        _resetGameState();
        AudioManager.stopMusic();
        if (pauseBtn) pauseBtn.textContent = '❚❚';
      }
      // playing → game_over happens via collision detection, not input
    }

    // PhysicsEngine — Applies gravity, jump impulse, and terminal velocity clamping
    const PhysicsEngine = (() => {
      function _clamp(val, min, max) {
        return val < min ? min : val > max ? max : val;
      }

      function update(ghost, dt, state) {
        if (state !== 'playing') return;

        // Apply gravity (acceleration)
        ghost.velocity += CONFIG.physics.gravity * dt;

        // Clamp velocity between terminal velocities
        ghost.velocity = _clamp(ghost.velocity, CONFIG.physics.terminalVelocityUp, CONFIG.physics.terminalVelocityDown);

        // Update position (frame-rate independent)
        ghost.y += ghost.velocity * dt;
      }

      function applyJump(ghost) {
        ghost.velocity = CONFIG.physics.jumpVelocity;
      }

      return { update, applyJump };
    })();
    // ScrollingEngine — Manages pipe generation, movement, and off-screen removal
    const ScrollingEngine = (() => {
      // Create and prewarm pools
      const pipePool = new ObjectPool(() => ({
        x: 0,
        width: CONFIG.pipes.width,
        gapCenterY: 0,
        gapHeight: 0,
        scored: false
      }));
      pipePool.prewarm(CONFIG.pools.pipes);

      const collectiblePool = new ObjectPool(() => ({
        x: 0,
        y: 0,
        width: CONFIG.collectibles.width,
        height: CONFIG.collectibles.height,
        speed: 0,
        opacity: 0,
        oscillateOffset: 0,
        collected: false
      }));
      collectiblePool.prewarm(CONFIG.pools.collectibles);

      const cloudPool = new ObjectPool(() => ({
        x: 0,
        y: 0,
        width: 0,
        height: 0,
        layer: 0,
        speed: 0,
        opacity: 0,
        scale: 0
      }));
      cloudPool.prewarm(CONFIG.pools.clouds);

      function spawnPipePair(difficulty) {
        const pipe = pipePool.acquire();
        pipe.x = CONFIG.canvas.width;
        pipe.width = CONFIG.pipes.width;
        pipe.gapHeight = difficulty.gapHeight;
        pipe.scored = false;

        // Gap center between 20% and 80% of playable area
        const playableHeight = CONFIG.canvas.height - CONFIG.canvas.hudHeight;
        const minY = playableHeight * CONFIG.pipes.gapMinPercent;
        const maxY = playableHeight * CONFIG.pipes.gapMaxPercent;
        pipe.gapCenterY = minY + Math.random() * (maxY - minY);

        return pipe;
      }

      function removeOffscreen(gameObjects) {
        // Remove pipes whose right edge has passed x=0
        let i = gameObjects.pipes.length;
        while (i--) {
          const pipe = gameObjects.pipes[i];
          if (pipe.x + pipe.width < 0) {
            gameObjects.pipes.splice(i, 1);
            pipePool.release(pipe);
          }
        }

        // Remove collectibles whose right edge has passed x=0
        if (gameObjects.collectibles) {
          let j = gameObjects.collectibles.length;
          while (j--) {
            const c = gameObjects.collectibles[j];
            if (c.x + c.width < 0) {
              gameObjects.collectibles.splice(j, 1);
              collectiblePool.release(c);
            }
          }
        }
      }

      function update(gameObjects, dt, difficulty, state) {
        if (state !== 'playing') return;

        // Move all pipes left
        for (let i = 0; i < gameObjects.pipes.length; i++) {
          gameObjects.pipes[i].x -= difficulty.pipeSpeed * dt;
        }

        // Move all collectibles left at their individual speed
        if (gameObjects.collectibles) {
          for (let i = 0; i < gameObjects.collectibles.length; i++) {
            gameObjects.collectibles[i].x -= gameObjects.collectibles[i].speed * dt;
          }
        }

        // Spawn new pipe pair if needed
        const spacing = difficulty.pipeSpacing || CONFIG.difficulty.baseSpacing;
        let rightmostEdge = -Infinity;
        let rightmostPipe = null;
        for (let i = 0; i < gameObjects.pipes.length; i++) {
          const rightEdge = gameObjects.pipes[i].x + gameObjects.pipes[i].width;
          if (rightEdge > rightmostEdge) {
            rightmostEdge = rightEdge;
            rightmostPipe = gameObjects.pipes[i];
          }
        }

        // If no pipes exist, or rightmost pipe is far enough from right edge, spawn
        if (gameObjects.pipes.length === 0 || (CONFIG.canvas.width - rightmostEdge) >= spacing) {
          const newPipe = spawnPipePair(difficulty);
          gameObjects.pipes.push(newPipe);

          // Attempt to spawn a collectible between the previous and new pipe
          if (rightmostPipe && gameObjects.collectibles) {
            const collectible = spawnCollectible(rightmostPipe, newPipe, difficulty);
            if (collectible) {
              gameObjects.collectibles.push(collectible);
            }
          }
        }

        // Remove off-screen objects
        removeOffscreen(gameObjects);
      }

      function spawnCollectible(prevPipe, newPipe, difficulty) {
        // Probability check: random value between 30%-50%
        const spawnProb = CONFIG.collectibles.spawnProbabilityMin +
          Math.random() * (CONFIG.collectibles.spawnProbabilityMax - CONFIG.collectibles.spawnProbabilityMin);
        if (Math.random() > spawnProb) return null;

        const collectible = collectiblePool.acquire();

        // Position at horizontal midpoint between previous pipe trailing edge and new pipe leading edge
        const prevTrailing = prevPipe.x + prevPipe.width;
        const nextLeading = newPipe.x;
        collectible.x = (prevTrailing + nextLeading) / 2;

        // Random Y within playable area (20%-80%)
        const playableH = CONFIG.canvas.height - CONFIG.canvas.hudHeight;
        collectible.y = playableH * 0.2 + Math.random() * playableH * 0.6;

        // Speed: 50%-150% of current pipe speed
        const speedFactor = CONFIG.collectibles.speedFactorMin +
          Math.random() * (CONFIG.collectibles.speedFactorMax - CONFIG.collectibles.speedFactorMin);
        collectible.speed = difficulty.pipeSpeed * speedFactor;

        // Opacity correlates with speed: faster = more opaque (appears closer)
        // Map speedFactor [0.5, 1.5] → opacity [0.4, 0.7]
        const opacityRange = CONFIG.collectibles.opacityMax - CONFIG.collectibles.opacityMin;
        const speedRange = CONFIG.collectibles.speedFactorMax - CONFIG.collectibles.speedFactorMin;
        collectible.opacity = CONFIG.collectibles.opacityMin +
          ((speedFactor - CONFIG.collectibles.speedFactorMin) / speedRange) * opacityRange;

        // Random phase offset for vertical oscillation
        collectible.oscillateOffset = Math.random() * Math.PI * 2;
        collectible.collected = false;
        collectible.width = CONFIG.collectibles.width;
        collectible.height = CONFIG.collectibles.height;

        return collectible;
      }

      /**
       * Spawn a cloud for a given parallax layer.
       */
      function spawnCloud(layer, difficulty, initialSpread) {
        const cloud = cloudPool.acquire();
        const layerDef = CONFIG.clouds.layers[layer];

        // Random speed within layer's speedFactor range × pipeSpeed
        const speedFactor = layerDef.speedFactor[0] + Math.random() * (layerDef.speedFactor[1] - layerDef.speedFactor[0]);
        cloud.speed = speedFactor * difficulty.pipeSpeed;

        // Random opacity within layer's opacity range
        cloud.opacity = layerDef.opacity[0] + Math.random() * (layerDef.opacity[1] - layerDef.opacity[0]);

        // Random scale within layer's scale range
        cloud.scale = layerDef.scale[0] + Math.random() * (layerDef.scale[1] - layerDef.scale[0]);

        // Width = random baseWidth × scale
        const baseW = CONFIG.clouds.baseWidth[0] + Math.random() * (CONFIG.clouds.baseWidth[1] - CONFIG.clouds.baseWidth[0]);
        cloud.width = baseW * cloud.scale;
        cloud.height = cloud.width * 0.5;

        // Y = random position within playable area
        const playableHeight = CONFIG.canvas.height - CONFIG.canvas.hudHeight;
        cloud.y = Math.random() * (playableHeight - cloud.height);

        // X position
        if (initialSpread) {
          // Distribute across full canvas width for initial population
          cloud.x = Math.random() * (CONFIG.canvas.width + cloud.width) - cloud.width;
        } else {
          // Spawn off-screen right with random offset
          cloud.x = CONFIG.canvas.width + Math.random() * 100;
        }

        cloud.layer = layer;
        return cloud;
      }

      /**
       * Pre-populate clouds array with 2-5 clouds per layer, distributed across canvas.
       */
      function initClouds(difficulty) {
        const clouds = [[], [], []];
        for (let layer = 0; layer < 3; layer++) {
          const minCount = CONFIG.clouds.countPerLayer[0];
          const maxCount = CONFIG.clouds.countPerLayer[1];
          const count = minCount + Math.floor(Math.random() * (maxCount - minCount + 1));
          for (let i = 0; i < count; i++) {
            clouds[layer].push(spawnCloud(layer, difficulty, true));
          }
        }
        return clouds;
      }

      /**
       * Update clouds: move left, recycle off-screen, maintain count.
       * Works in ALL states except paused.
       */
      function updateClouds(clouds, dt, difficulty, state) {
        if (state === 'paused') return;

        for (let layer = 0; layer < 3; layer++) {
          const layerClouds = clouds[layer];

          // Move clouds left at their individual speed
          for (let i = 0; i < layerClouds.length; i++) {
            layerClouds[i].x -= layerClouds[i].speed * dt;
          }

          // Recycle clouds that moved off-screen left
          for (let i = 0; i < layerClouds.length; i++) {
            const cloud = layerClouds[i];
            if (cloud.x + cloud.width < 0) {
              // Reposition off-screen right with new random Y
              cloud.x = CONFIG.canvas.width + Math.random() * 100;
              const playableHeight = CONFIG.canvas.height - CONFIG.canvas.hudHeight;
              cloud.y = Math.random() * (playableHeight - cloud.height);
            }
          }

          // Maintain cloud count: if layer has fewer than min, spawn new ones
          const minCount = CONFIG.clouds.countPerLayer[0];

    function createWingAnimController(config) {
      const cfg = {
        baseRateMin: (config.baseRateMin > 0) ? config.baseRateMin : 250,
        baseRateMax: (config.baseRateMax > 0) ? config.baseRateMax : 350,
        jumpRateMin: (config.jumpRateMin > 0) ? config.jumpRateMin : 120,
        jumpRateMax: (config.jumpRateMax > 0) ? config.jumpRateMax : 180,
        rapidRateMin: (config.rapidRateMin > 0) ? config.rapidRateMin : 60,

      };

      let frameTimer = 0;
      let tier = 'base';

      let jumpBoostTimer = 0;
      let lastJumpTimestamps = [];
      let elapsedTime = 0;
      // Single jump → a calm two-phase wingbeat (down, then up), then resume base loop.
      // Continuous/rapid jumps keep the fast switching cycle instead.
      let flapPhase = 0;        // 0 = not flapping, 1 = downstroke, 2 = upstroke
      let flapTimer = 0;        // ms remaining in the current flap half
      const FLAP_HALF_MS = 90;  // duration of each half of the single-jump flap

      function _getRateForTier(t) {
        switch (t) {
          case 'jump': return (cfg.jumpRateMin + cfg.jumpRateMax) / 2;
          case 'rapid': return (cfg.rapidRateMin + cfg.rapidRateMax) / 2;
          default: return (cfg.baseRateMin + cfg.baseRateMax) / 2;
        }
      }

      function _advanceFrame(dtMs) {
        frameTimer += dtMs;
        while (frameTimer >= currentRate) {
          frameTimer -= currentRate;
          currentFrame = (currentFrame === 'up') ? 'down' : 'up';
        }
      }

      function _pruneJumpTimestamps() {
        const cutoff = elapsedTime - cfg.rapidDetectionWindow;
        while (lastJumpTimestamps.length > 0 && lastJumpTimestamps[0] < cutoff) {
          lastJumpTimestamps.shift();
        }
      }

      function _isRapidJumping() {
        return lastJumpTimestamps.length >= 2;
      }

      function update(dt, jumpTriggeredThisFrame, jumpHeld, gameState) {
        if (dt <= 0) return;
        if (gameState === 'paused' || gameState === 'game_over') return;

        const dtMs = dt * 1000;
        elapsedTime += dtMs;

        if (gameState === 'ready') {
          tier = 'base';
          currentRate = _getRateForTier('base');
          _advanceFrame(dtMs);
          return;
        }

        // Playing state - handle tier transitions
        if (jumpTriggeredThisFrame) {
          lastJumpTimestamps.push(elapsedTime);
          _pruneJumpTimestamps();

          if (_isRapidJumping()) {
            // Continuous/rapid jumping → fast switching cycle (instant flip + fast loop)
            currentFrame = (currentFrame === 'up') ? 'down' : 'up';
            frameTimer = 0;
            tier = 'rapid';
            currentRate = _getRateForTier('rapid');
            flapPhase = 0;
          } else {
            // Single jump → calm two-phase wingbeat (downstroke, then upstroke)
            tier = 'flap';
            flapPhase = 1;
            flapTimer = FLAP_HALF_MS;
            currentFrame = 'down';
            frameTimer = 0;
          }

        lastJumpTimestamps = [];

        // Descending: clockwise (positive rotation)
        const t = Math.min(velocity / config.maxDescentVelocity, 1.0);
        return t * config.maxDownTilt;
      } else if (velocity < 0) {
        // Ascending: counter-clockwise (negative rotation)
        const t = Math.min(-velocity / config.maxAscentVelocity, 1.0);
        return -t * config.maxUpTilt;
      }
      return 0; // Level
    }

    // ============================================================
    // drawRoundedRect — Utility for drawing rounded rectangles (pipe caps, etc.)
    // ============================================================
    function drawRoundedRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.arcTo(x + width, y, x + width, y + radius, radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.arcTo(x + width, y + height, x + width - radius, y + height, radius);
      ctx.lineTo(x + radius, y + height);
      ctx.arcTo(x, y + height, x, y + height - radius, radius);
      ctx.lineTo(x, y + radius);
      ctx.arcTo(x, y, x + radius, y, radius);
      ctx.closePath();
      ctx.fill();
    }

    // ============================================================
    // renderPipeCaps — Draws darker rounded caps at gap-facing edges of pipes
    // ============================================================
    function renderPipeCaps(ctx, pipes, config) {
      const capOverhang = config.pipes.capOverhang;     // 8px each side
      const capHeight = config.pipes.capHeight;         // 25px
      const capRadius = config.pipes.capBorderRadius;   // 4px
      const capColor = config.pipes.capColor;           // darker green

      ctx.fillStyle = capColor;
      for (const pipe of pipes) {
        const topPipeBottom = pipe.gapCenterY - pipe.gapHeight / 2;
        const botPipeTop = pipe.gapCenterY + pipe.gapHeight / 2;
        const capX = pipe.x - capOverhang;
        const capWidth = pipe.width + capOverhang * 2;

        // Top pipe cap (at bottom of top pipe, facing gap)
        drawRoundedRect(ctx, capX, topPipeBottom - capHeight, capWidth, capHeight, capRadius);
        // Bottom pipe cap (at top of bottom pipe, facing gap)
        drawRoundedRect(ctx, capX, botPipeTop, capWidth, capHeight, capRadius);
      }
    }

    // ============================================================
    // Flying Obstacle Manager — Inline spawn/update/removal for flying obstacles
    // ============================================================
    const FlyingObstacleManager = (() => {
      const fCfg = CONFIG.flyingObstacles;
      const characterHeight = CONFIG.character.spriteHeight;
      const flyingObsHeight = Math.round(characterHeight * fCfg.heightRatio); // 44px (same height as Nailong)
      const flyingObsWidth = Math.round(flyingObsHeight * 1.2); // keep enemy proportions (~53px)

      // Object pool for flying obstacles
      const pool = new ObjectPool(() => ({
        x: 0, y: 0, width: flyingObsWidth, height: flyingObsHeight, speed: 0, active: false,
        baseY: 0, bobAmp: 0, bobFreq: 0, bobPhase: 0, bobTimer: 0
      }));
      pool.prewarm(fCfg.poolSize);

      /**
       * Pick a spawn Y (top-left) that will NOT line up with the gap the player is
       * forced through. The only moment the player is locked to a specific height is
       * while threading a pipe gap, so we predict which pipe will be at the player's
       * column when THIS obstacle reaches it (the obstacle is faster than the pipes)
       * and avoid that pipe's gap band — plus any pipe currently at the player's column.
       */
      function pickSafeY(minY, maxY, height, pipes, bobAmp, startX, obstacleSpeed, pipeSpeed) {
        const ghostR = CONFIG.ghost.hitboxRadius;
        const playerX = CONFIG.character.startX + CONFIG.character.spriteWidth / 2;
        const pipeW = CONFIG.pipes.width;
        const zone = (pipeW + height) / 2 + 70; // X-distance that counts as "the player's pipe"

        // How long until this obstacle reaches the player's column, and how far the
        // pipes will have scrolled left by then.
        const timeToPlayer = (obstacleSpeed > 0) ? (startX - playerX) / obstacleSpeed : 0;
        const pipeShift = pipeSpeed * timeToPlayer;

        // Forbidden gap bands: the pipe predicted to be at the player's column on
        // arrival, plus any pipe currently overlapping the player's column.
        const bands = [];
        for (let p = 0; p < pipes.length; p++) {
          const pipe = pipes[p];
          const predictedCenter = (pipe.x - pipeShift) + pipeW / 2;
          const currentCenter = pipe.x + pipeW / 2;
          if (Math.abs(predictedCenter - playerX) <= zone || Math.abs(currentCenter - playerX) <= zone) {
            bands.push([pipe.gapCenterY - pipe.gapHeight / 2, pipe.gapCenterY + pipe.gapHeight / 2]);
          }
        }

        function overlapsBand(y) {
          // Full vertical extent the obstacle can occupy, incl. bob + player clearance
          const top = y - bobAmp - ghostR;
          const bot = y + height + bobAmp + ghostR;
          for (let i = 0; i < bands.length; i++) {
            if (!(bot < bands[i][0] || top > bands[i][1])) return true;
          }
          return false;
        }

        // Return the first candidate that clears every forbidden band
        for (let a = 0; a < 24; a++) {
          const y = minY + Math.random() * (maxY - minY);
          if (!overlapsBand(y)) return y;
        }

        // Fallback (rare): the candidate furthest from the nearest forbidden band
        let best = minY + Math.random() * (maxY - minY);
        let bestClearance = -Infinity;
        for (let a = 0; a < 24; a++) {
          const y = minY + Math.random() * (maxY - minY);
          const center = y + height / 2;
          let minClearance = Infinity;
          for (let i = 0; i < bands.length; i++) {
            const bandCenter = (bands[i][0] + bands[i][1]) / 2;
            const d = Math.abs(center - bandCenter);
            if (d < minClearance) minClearance = d;
          }
          if (minClearance > bestClearance) {
            bestClearance = minClearance;
            best = y;
          }
        }
        return best;
      }

      /**
       * Spawn a flying obstacle if conditions are met.
       */
      function spawn(difficulty, score, flyingObstacles, pipes) {
        if (score < fCfg.activationThreshold) return null;
        if (flyingObstacles.length >= fCfg.maxOnScreen) return null;

        const obs = pool.acquire();
        obs.width = flyingObsWidth;
        obs.height = flyingObsHeight;
        obs.x = CONFIG.canvas.width + flyingObsWidth;

        // Gentle vertical bobbing for a more natural flight path
        obs.bobAmp = 8 + Math.random() * 6;       // 8–14px swing
        obs.bobFreq = 1.5 + Math.random() * 1.5;  // rad/s
        obs.bobPhase = Math.random() * Math.PI * 2;
        obs.bobTimer = 0;

        // Speed: pipeSpeed × speedMultiplier (needed before choosing a safe Y)
        const speedMult = difficulty.flyingObstacleSpeedMultiplier || fCfg.baseSpeedMultiplier;
        obs.speed = difficulty.pipeSpeed * speedMult;

        // Vertical position: random within 15%–85% of playable height, but never aligned
        // with the gap the player is forced through when this obstacle reaches them.
        const playableHeight = CONFIG.canvas.height - CONFIG.canvas.hudHeight;
        const minY = playableHeight * fCfg.spawnYMinPercent;
        const maxY = playableHeight * fCfg.spawnYMaxPercent;
        obs.baseY = pickSafeY(minY, maxY, obs.height, pipes || [], obs.bobAmp, obs.x, obs.speed, difficulty.pipeSpeed);
        obs.y = obs.baseY;

        obs.active = true;
        return obs;
      }

      /**
       * Update flying obstacles: move, spawn via timer, remove off-screen.
       */
      function update(gameState, dt, state, difficulty, score) {
        const flyingObstacles = gameState.flyingObstacles;

        // No movement or spawning in non-playing states
        if (state !== 'playing') return;

        // Move all obstacles left, with gentle vertical bobbing
        for (let i = 0; i < flyingObstacles.length; i++) {
          const obs = flyingObstacles[i];
          obs.x -= obs.speed * dt;
          obs.bobTimer += dt;
          obs.y = obs.baseY + Math.sin(obs.bobTimer * obs.bobFreq + obs.bobPhase) * obs.bobAmp;
        }

        // Spawn timer logic (only when score >= threshold)
        if (score >= fCfg.activationThreshold && difficulty.flyingObstacleSpawnInterval) {
          gameState.flyingObsSpawnTimer += dt * 1000;

          // Initialize interval if not set
          if (gameState.flyingObsCurrentInterval <= 0) {
            const interval = difficulty.flyingObstacleSpawnInterval;
            gameState.flyingObsCurrentInterval = interval.min + Math.random() * (interval.max - interval.min);
          }

          // Check if timer expired
          if (gameState.flyingObsSpawnTimer >= gameState.flyingObsCurrentInterval) {
            gameState.flyingObsSpawnTimer = 0;

            const newObs = spawn(difficulty, score, flyingObstacles, gameState.pipes);
            if (newObs) {
              flyingObstacles.push(newObs);
            }

            // Reset interval for next spawn
            const interval = difficulty.flyingObstacleSpawnInterval;
            gameState.flyingObsCurrentInterval = interval.min + Math.random() * (interval.max - interval.min);
          }
        }

        // Remove off-screen obstacles (right edge < 0)
        let i = flyingObstacles.length;
        while (i--) {
          if (flyingObstacles[i].x + flyingObstacles[i].width < 0) {
            const removed = flyingObstacles.splice(i, 1)[0];
            removed.active = false;
            pool.release(removed);
          }
        }
      }

      return { spawn, update, pool };
    })();

    // ============================================================
    // renderFlyingObstacles — Draws flying enemy obstacles with image or fallback
    // ============================================================
    function renderFlyingObstacles(ctx, obstacles, sprite) {
      for (const obs of obstacles) {
        if (sprite) {
          ctx.drawImage(sprite, obs.x, obs.y, obs.width, obs.height);
        } else {
          // Fallback: red circle
          ctx.fillStyle = '#e74c3c';
          ctx.beginPath();
          ctx.arc(obs.x + obs.width / 2, obs.y + obs.height / 2, obs.height / 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    // Renderer — Orchestrates all drawing in correct z-order with batched operations
    const Renderer = (() => {
      // Score is shown in a DOM bar below the canvas (matches v1 framed layout)
      const scoreBarEl = document.getElementById('score-bar');

      // Nailong sprite references (set after asset load)
      let nailongUpSprite = null;
      let nailongDownSprite = null;
      // Flying enemy sprite reference (set after asset load)
      let flyingEnemySprite = null;
      // Legacy ghost sprite (kept for backward compat, not used if Nailong loads)
      let ghostSprite = null;
      function setGhostSprite(img) { ghostSprite = img; }
      function setNailongSprites(upImg, downImg) {
        nailongUpSprite = upImg;
        nailongDownSprite = downImg;
      }
      function setFlyingEnemySprite(img) { flyingEnemySprite = img; }

      function draw(ctx, gameState, time) {
        const { ghost, pipes, collectibles, clouds, shake, score, highScore } = gameState;

        // Screen shake — apply transform offset before all draws
        if (shake.active) {
          const offset = ScreenShake.getOffset(shake);
          ctx.save();
          ctx.translate(offset.ox, offset.oy);
        }

        // 1. Sky background
        ctx.fillStyle = CONFIG.canvas.backgroundColor;
        ctx.fillRect(0, 0, CONFIG.canvas.width, CONFIG.canvas.height);

        // 2-4. Clouds by layer (back to front: far → mid → near)
        ctx.fillStyle = '#ffffff';
        for (let layer = 0; layer < 3; layer++) {
          if (!clouds[layer]) continue;
          for (const cloud of clouds[layer]) {
            ctx.globalAlpha = cloud.opacity;
            ctx.beginPath();
            ctx.ellipse(
              cloud.x + cloud.width / 2, cloud.y + cloud.height / 2,
              cloud.width / 2, cloud.height / 2,
              0, 0, Math.PI * 2
            );
            ctx.fill();
          }
        }
        ctx.globalAlpha = 1;

        // 5. Pipes — batched fill pass (single beginPath, multiple rects, one fill)
        ctx.fillStyle = CONFIG.pipes.fillColor;
        ctx.beginPath();
        for (const pipe of pipes) {
          const topH = pipe.gapCenterY - pipe.gapHeight / 2;
          const botY = pipe.gapCenterY + pipe.gapHeight / 2;
          ctx.rect(pipe.x, 0, pipe.width, topH);
          ctx.rect(pipe.x, botY, pipe.width, CONFIG.canvas.height - botY);
        }
        ctx.fill();

        // Pipes — batched stroke pass (darker outline, 2px+)
        ctx.strokeStyle = CONFIG.pipes.outlineColor;
        ctx.lineWidth = CONFIG.pipes.outlineWidth;
        ctx.beginPath();
        for (const pipe of pipes) {
          const topH = pipe.gapCenterY - pipe.gapHeight / 2;
          const botY = pipe.gapCenterY + pipe.gapHeight / 2;
          ctx.rect(pipe.x, 0, pipe.width, topH);
          ctx.rect(pipe.x, botY, pipe.width, CONFIG.canvas.height - botY);
        }
        ctx.stroke();

        // Pipe caps — drawn after pipe bodies for correct z-order
        renderPipeCaps(ctx, pipes, CONFIG);

        // 6. Collectibles — golden rounded rects with oscillation animation
        if (collectibles) {
          ctx.fillStyle = '#F5C542';
          for (const c of collectibles) {
            if (c.collected) continue;
            ctx.globalAlpha = c.opacity;
            const oscillation = Math.sin((time || 0) * 3 + c.oscillateOffset) * 5;
            const drawY = c.y + oscillation;
            const r = 5;
            ctx.beginPath();
            ctx.moveTo(c.x + r, drawY);
            ctx.lineTo(c.x + c.width - r, drawY);
            ctx.quadraticCurveTo(c.x + c.width, drawY, c.x + c.width, drawY + r);
            ctx.lineTo(c.x + c.width, drawY + c.height - r);
            ctx.quadraticCurveTo(c.x + c.width, drawY + c.height, c.x + c.width - r, drawY + c.height);
            ctx.lineTo(c.x + r, drawY + c.height);
            ctx.quadraticCurveTo(c.x, drawY + c.height, c.x, drawY + c.height - r);
            ctx.lineTo(c.x, drawY + r);
            ctx.quadraticCurveTo(c.x, drawY, c.x + r, drawY);
            ctx.closePath();
            ctx.fill();
          }
          ctx.globalAlpha = 1;
        }

        // 7. Flying obstacles (after collectibles, before particles)
        if (gameState.flyingObstacles && gameState.flyingObstacles.length > 0) {
          renderFlyingObstacles(ctx, gameState.flyingObstacles, flyingEnemySprite);
        }

        // 8. Particle trail (ParticleSystem handles batching by opacity)
        ParticleSystem.render(ctx);

        // 9. Nailong sprite — frame-based wing animation with idle bob and death effects
        const wingFrame = wingAnimController.getCurrentFrame();
        const nailongSprite = wingFrame === 'up' ? nailongUpSprite : nailongDownSprite;

        // Idle bob during Ready state (±2px, 800ms sine cycle)
        let drawY = ghost.y;
        if (gameState.state === 'ready') {
          drawY = ghost.y + Math.sin((time || 0) * 2.5) * 2;
        }

        ctx.save();
        const centerX = ghost.x + ghost.width / 2;
        const centerY = drawY + ghost.height / 2;

        // Death rotation and opacity fade during game_over
        if (gameState.state === 'game_over') {
          ctx.translate(centerX, centerY);
          // Rotation: 2 rad/s from moment of death
          const deathElapsed = (time || 0) - (gameState._deathTime || (time || 0));
          ctx.rotate(deathElapsed * 2);
          // Opacity fade: 1.0 → 0.4 over 400ms
          const fadeProgress = Math.min(1, deathElapsed / 0.4);
          ctx.globalAlpha = 1.0 - fadeProgress * 0.6;
          if (nailongSprite) {
            ctx.drawImage(nailongSprite, -ghost.width / 2, -ghost.height / 2, ghost.width, ghost.height);
          } else {
            // Fallback: white circle
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(0, 0, ghost.width / 2, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalAlpha = 1;
        } else {
          ctx.translate(centerX, centerY);
          ctx.rotate(ghost.tiltAngle || 0);
          if (nailongSprite) {
            ctx.drawImage(nailongSprite, -ghost.width / 2, -ghost.height / 2, ghost.width, ghost.height);
          } else {
            // Fallback: white circle if sprites failed to load
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(0, 0, ghost.width / 2, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        ctx.restore();

        // 10. Score popups (ScorePopupManager handles its own rendering)
        ScorePopupManager.render(ctx);

        // 11. HUD score — update the DOM score bar below the canvas
        if (scoreBarEl) {
          scoreBarEl.textContent = ScoreManager.getHudText();
        }

        // 12. Overlay screens (Ready, Paused, GameOver)
        drawOverlay(ctx, gameState.state, time);

        // End screen shake transform
        if (shake.active) {
          ctx.restore();
        }
      }

      function drawOverlay(ctx, state, time) {
        if (state === 'ready') {
          // Ready screen: title, pulsing start prompt, high score
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 20px monospace';
          ctx.textAlign = 'center';
          ctx.fillText('FLAPPY NAILONG', CONFIG.canvas.width / 2, CONFIG.canvas.height / 3);

          // Start prompt with pulsing opacity
          ctx.globalAlpha = 0.6 + 0.4 * Math.sin(Date.now() / 500);
          ctx.font = '14px monospace';
          ctx.fillText('TAP OR PRESS SPACE TO START', CONFIG.canvas.width / 2, CONFIG.canvas.height / 2 + 60);
          ctx.globalAlpha = 1;

          // High score display
          ctx.font = '14px monospace';
          ctx.fillText('Best: ' + ScoreManager.highScore, CONFIG.canvas.width / 2, CONFIG.canvas.height / 2 + 90);
        }
        else if (state === 'paused') {
          // Semi-transparent dark overlay
          ctx.fillStyle = 'rgba(0,0,0,0.6)';
          ctx.fillRect(0, 0, CONFIG.canvas.width, CONFIG.canvas.height);

          // "Paused" text
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 24px monospace';
          ctx.textAlign = 'center';
          ctx.fillText('PAUSED', CONFIG.canvas.width / 2, CONFIG.canvas.height / 2 - 20);

          // Resume prompt
          ctx.font = '14px monospace';
          ctx.fillText('Press ESC or P to resume', CONFIG.canvas.width / 2, CONFIG.canvas.height / 2 + 20);
        }
        else if (state === 'game_over') {
          // Semi-transparent dark overlay
          ctx.fillStyle = 'rgba(0,0,0,0.6)';
          ctx.fillRect(0, 0, CONFIG.canvas.width, CONFIG.canvas.height);

          // "GAME OVER" text in red
          ctx.fillStyle = '#e74c3c';
          ctx.font = 'bold 24px monospace';
          ctx.textAlign = 'center';
          ctx.fillText('GAME OVER', CONFIG.canvas.width / 2, CONFIG.canvas.height / 3);

          // Final score (white — only the GAME OVER title is colored)
          ctx.fillStyle = '#ffffff';
          ctx.font = '18px monospace';
          ctx.fillText('Score: ' + ScoreManager.currentScore, CONFIG.canvas.width / 2, CONFIG.canvas.height / 2 - 20);

          // High score
          ctx.fillText('Best: ' + ScoreManager.highScore, CONFIG.canvas.width / 2, CONFIG.canvas.height / 2 + 20);

          // New high score indicator
          if (ScoreManager.isNewHighScore) {
            ctx.fillStyle = '#FFD700';
            ctx.fillText('NEW HIGH SCORE!', CONFIG.canvas.width / 2, CONFIG.canvas.height / 2 + 60);
          }

          // Restart prompt (pulsing)
          ctx.fillStyle = '#ffffff';
          ctx.globalAlpha = 0.6 + 0.4 * Math.sin(Date.now() / 500);
          ctx.font = '14px monospace';
          ctx.fillText('TAP OR PRESS SPACE TO RESTART', CONFIG.canvas.width / 2, CONFIG.canvas.height * 2 / 3);
          ctx.globalAlpha = 1;
        }
      }

      return { draw, drawOverlay, setGhostSprite, setNailongSprites, setFlyingEnemySprite };
    })();

    // ============================================================
    // GameLoop — Central orchestrator driving the frame update cycle
    // ============================================================
    // rAF fallback for environments without requestAnimationFrame
    const _requestAnimationFrame = window.requestAnimationFrame || (fn => setTimeout(fn, 16));
    const _cancelAnimationFrame = window.cancelAnimationFrame || (id => clearTimeout(id));

    const GameLoop = (() => {
      let _rafId = null;
      let _running = false;
      let _lastTimestamp = 0;

      function start() {
        if (_running) return;
        _running = true;
        _lastTimestamp = performance.now();
        _rafId = _requestAnimationFrame(tick);
      }

      function stop() {
        _running = false;
        if (_rafId !== null) {
          _cancelAnimationFrame(_rafId);
          _rafId = null;
        }
      }

      function tick(timestamp) {
        if (!_running) return;

        // 1. Calculate delta-time (seconds), clamp to prevent spiral-of-death
        const dt = Math.min((timestamp - _lastTimestamp) / 1000, CONFIG.canvas.maxDt);
        _lastTimestamp = timestamp;
        const timeInSeconds = timestamp / 1000;

        // 2. Input (poll and consume buffered flags)
        const jump = InputHandler.pollJump();
        const pause = InputHandler.pollPause();

        // 3. State transitions (based on input + current state)
        processTransitions(jump, pause);

        // 4. Physics (apply gravity, jump, clamp velocity, update position)
        if (StateManager.isPlaying() && jump) {
          PhysicsEngine.applyJump(gameState.ghost);
          AudioManager.playJump();
        }
        PhysicsEngine.update(gameState.ghost, dt, StateManager.currentState);

        // 4.5 Wing animation update (after physics, before scrolling)
        wingAnimController.update(dt, jump, false, StateManager.currentState);

        // 4.6 Tilt calculation (purely visual, does not affect collision hitbox)
        // While rapid-jumping, hold a steady ascending (upward) tilt — the per-jump
        // velocity swings would otherwise flip the tilt back and forth and look glitchy.
        // Once rapid jumping stops, the normal velocity-based tilt resumes, so it
        // naturally tilts forward as the character begins to descend.
        if (wingAnimController.isRapid()) {
          gameState.ghost.tiltAngle = calculateTilt(CONFIG.physics.terminalVelocityUp, CONFIG.character);
        } else {
          gameState.ghost.tiltAngle = calculateTilt(gameState.ghost.velocity, CONFIG.character);
        }

        // 5. Scrolling (move pipes, collectibles; spawn/recycle)
        ScrollingEngine.update(gameState, dt, gameState.difficulty, StateManager.currentState);
        // Clouds update (works in all states except paused)
        ScrollingEngine.updateClouds(gameState.clouds, dt, gameState.difficulty, StateManager.currentState);
        // Flying obstacles update (spawn, move, remove off-screen)
        FlyingObstacleManager.update(gameState, dt, StateManager.currentState, gameState.difficulty, ScoreManager.currentScore);

        // 6. Collision detection
        if (StateManager.isPlaying()) {
          const collision = CollisionDetector.check(gameState.ghost, gameState.pipes);
          if (collision.collided) {
            StateManager.transition('game_over');
            gameState._deathTime = performance.now() / 1000; // Track death time for animation
            AudioManager.playGameOver();
            ScreenShake.activate(gameState.shake);
            ScoreManager.onGameOver();
          }

          // Flying obstacle collision check (after pipe check)
          if (StateManager.isPlaying() && gameState.flyingObstacles.length > 0) {
            const flyingCollision = CollisionDetector.checkFlyingObstacles(gameState.ghost, gameState.flyingObstacles);
            if (flyingCollision.collided) {
              StateManager.transition('game_over');
              gameState._deathTime = performance.now() / 1000;
              AudioManager.playGameOver();
              ScreenShake.activate(gameState.shake);
              ScoreManager.onGameOver();
            }
          }
        }

        // 7. Difficulty evaluation
        gameState.difficulty = DifficultyManager.evaluate(ScoreManager.currentScore);

        // 8. Scoring (pipe pass, collectible pickup)
        if (StateManager.isPlaying()) {
          const pipePoints = ScoreManager.checkPipePass(gameState.ghost, gameState.pipes);
          if (pipePoints > 0) {
            AudioManager.playScore();
            ScorePopupManager.create(gameState.ghost, '+' + pipePoints, '#FFFFFF');
          }
          const collectPoints = ScoreManager.checkCollectiblePickup(gameState.ghost, gameState.collectibles);
          if (collectPoints > 0) {
            AudioManager.playScore();
            ScorePopupManager.create(gameState.ghost, '+' + collectPoints, '#FFD700');
          }
        }

        // 9. Screen shake update
        ScreenShake.update(gameState.shake, dt);

        // 10. Score popup update
        ScorePopupManager.update(dt);

        // 11. Particles (emit trail/burst, age and remove dead)
        ParticleSystem.update(gameState.ghost, dt, StateManager.currentState, StateManager.isPlaying() && jump);

        // 12. Sync gameState.state with StateManager (for Renderer overlays)
        gameState.state = StateManager.currentState;

        // 13. Render (single draw call orchestration)
        Renderer.draw(ctx, gameState, timeInSeconds);

        // 14. Request next frame
        _rafId = _requestAnimationFrame(tick);
      }

      return { start, stop, tick };
    })();

    // ============================================================
    // Asset loader + Bootstrap
    // ============================================================

    async function loadAssets() {
      const errors = [];

      // Load Nailong sprites (two-frame wing animation)
      const nailongUpImg = new Image();
      const nailongUpPromise = new Promise((resolve) => {
        nailongUpImg.onload = () => resolve(nailongUpImg);
        nailongUpImg.onerror = () => { errors.push('Failed to load nailong_up.png'); resolve(null); };
        nailongUpImg.src = 'assets/nailong_up.png';
      });

      const nailongDownImg = new Image();
      const nailongDownPromise = new Promise((resolve) => {
        nailongDownImg.onload = () => resolve(nailongDownImg);
        nailongDownImg.onerror = () => { errors.push('Failed to load nailong_down.png'); resolve(null); };
        nailongDownImg.src = 'assets/nailong_down.png';
      });

      // Load flying enemy sprite
      const flyingEnemyImg = new Image();
      const flyingEnemyPromise = new Promise((resolve) => {
        flyingEnemyImg.onload = () => resolve(flyingEnemyImg);
        flyingEnemyImg.onerror = () => { errors.push('Failed to load flying_enemy.png'); resolve(null); };
        flyingEnemyImg.src = 'assets/flying_enemy.png';
      });

      // Load legacy ghost sprite as fallback
      const ghostImg = new Image();
      const ghostPromise = new Promise((resolve) => {
        ghostImg.onload = () => resolve(ghostImg);
        ghostImg.onerror = () => resolve(null);
        ghostImg.src = 'assets/ghosty.png';
      });

      // AudioManager.init() handles loading jump.wav and game_over.wav
      // via fetch + AudioContext.decodeAudioData internally

      const timeout = new Promise((_, reject) => {
        setTimeout(() => reject(new Error('Asset loading timed out (10s)')), 10000);
      });

      try {
        const [nailongUp, nailongDown, flyingEnemy, ghost] = await Promise.race([
          Promise.all([nailongUpPromise, nailongDownPromise, flyingEnemyPromise, ghostPromise, AudioManager.init()]),
          timeout
        ]);

        // Pass Nailong sprites to renderer
        Renderer.setNailongSprites(nailongUp, nailongDown);
        // Flying enemy sprite (null triggers red circle fallback)
        Renderer.setFlyingEnemySprite(flyingEnemy);
        // Legacy ghost sprite as additional fallback
        Renderer.setGhostSprite(ghost);
        return true;
      } catch (err) {
        errors.push(err.message);
        // Display error on canvas
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, CONFIG.canvas.width, CONFIG.canvas.height);
        ctx.fillStyle = '#ff0000';
        ctx.font = '14px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('Failed to load assets:', CONFIG.canvas.width / 2, CONFIG.canvas.height / 2 - 20);
        for (let i = 0; i < errors.length; i++) {
          ctx.fillText(errors[i], CONFIG.canvas.width / 2, CONFIG.canvas.height / 2 + 10 + i * 20);
        }
        return false;
      }
    }

    window.onload = async function() {
      const loaded = await loadAssets();
      if (loaded) {
        // Initialize clouds so they appear on the Ready screen
        gameState.clouds = ScrollingEngine.initClouds(gameState.difficulty);
        // Initialize InputHandler (attach DOM listeners)
        InputHandler.init(canvas);
        // Start the full GameLoop (handles all subsystem orchestration)
        GameLoop.start();
      }
    };

  </script>
</body>
</html>
